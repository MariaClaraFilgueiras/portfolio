<div class="app">
  <!-- Barra de cima (só no celular) -->
  <header class="topo-movel">
    <button class="btn-icone" type="button" id="abrir-gaveta" aria-label="Abrir menu" aria-controls="lateral" aria-expanded="false">
      <svg class="icone"><use href="#i-menu"/></svg>
    </button>
    <strong id="titulo-movel">Painel</strong>
  </header>
  <div class="gaveta-fundo" id="gaveta-fundo"></div>

  <!-- Menu lateral -->
  <aside class="lateral" id="lateral">
    <div class="lateral-marca">
      <b aria-hidden="true">MCF</b>
      <span>Maria Clara<small>painel</small></span>
    </div>
    <nav aria-label="Menu do painel">
      <p class="lateral-secao">meu site</p>
      <a class="lateral-item" href="#portfolio" data-aba="portfolio"><svg class="icone"><use href="#i-portfolio"/></svg>Portfólio</a>
      <a class="lateral-item" href="#marcas" data-aba="marcas"><svg class="icone"><use href="#i-marcas"/></svg>Marcas</a>
      <p class="lateral-secao">minha rotina</p>
      <a class="lateral-item" href="#calendario" data-aba="calendario"><svg class="icone"><use href="#i-calendario"/></svg>Calendário</a>
      <a class="lateral-item" href="#campanhas" data-aba="campanhas"><svg class="icone"><use href="#i-campanhas"/></svg>Campanhas</a>
      <a class="lateral-item" href="#checklist" data-aba="checklist"><svg class="icone"><use href="#i-checklist"/></svg>Checklist</a>
      <a class="lateral-item" href="#transcricoes" data-aba="transcricoes"><svg class="icone"><use href="#i-transcricao"/></svg>Transcrições</a>
    </nav>
    <a class="lateral-link-site" href="../" target="_blank" rel="noopener"><svg class="icone"><use href="#i-site"/></svg>Ver o meu site</a>
    <div class="lateral-rodape">
      <span class="email" id="email-logado"></span>
      <button class="btn btn-linha" type="button" id="sair"><svg class="icone"><use href="#i-sair"/></svg>Sair</button>
    </div>
  </aside>

  <!-- Conteúdo -->
  <main class="conteudo">
    <div class="cabeca">
      <h1 id="titulo-aba">Painel</h1>
      <span class="fraco" id="subtitulo-aba"></span>
    </div>
    <div class="avisos" id="avisos" aria-live="polite"></div>

    <section class="aba" id="aba-portfolio" data-aba="portfolio" hidden></section>
    <section class="aba" id="aba-marcas" data-aba="marcas" hidden></section>
    <section class="aba" id="aba-calendario" data-aba="calendario" hidden></section>
    <section class="aba" id="aba-campanhas" data-aba="campanhas" hidden></section>
    <section class="aba" id="aba-checklist" data-aba="checklist" hidden></section>
    <section class="aba" id="aba-transcricoes" data-aba="transcricoes" hidden></section>
  </main>
</div>

<!-- Janela usada pelos formulários e fichas -->
<dialog class="janela" id="janela"></dialog>
